name: lorekeeper
description: "Lorekeeper – il custode delle tue storie. Lettore di novel EPUB."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  archive: '>=3.6.0 <5.0.0'
  xml: ^6.5.0
  file_picker: ^8.1.7
  path_provider: ^2.1.4
  path: ^1.9.0
  shared_preferences: ^2.3.0
  flutter_secure_storage: ^9.2.2
  google_fonts: ^6.2.1
  http: ^1.2.2
  wakelock_plus: ^1.2.8
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  flutter_tts: ^4.2.0
  share_plus: ^10.1.4
  package_info_plus: ^8.1.0
  open_filex: ^4.6.0
  home_widget: ^0.7.0
  get: ^4.7.3
  flutter_web_auth_2: ^4.1.0
  workmanager: ^0.9.0
  quick_actions: ^1.1.0
  google_sign_in: ^6.2.2
  # Motore delle estensioni manga (Mangayomi + Mihon/Aniyomi), lo stesso di AnymeX
  anymex_extension_runtime_bridge:
    git:
      url: https://github.com/RyanYuuki/AnymeXExtensionRuntimeBridge.git
      ref: 15ad1d8261f2049ee97805fdde16689d2488c751

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#1C1714"
  adaptive_icon_foreground: "assets/icon/foreground.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#1C1714"
  image: "assets/icon/splash.png"
  android_12:
    color: "#1C1714"
    image: "assets/icon/splash.png"
    icon_background_color: "#1C1714"

flutter:
  uses-material-design: true
  assets:
    - assets/dividers/
    - assets/google_fonts/
    - assets/textures/
    - assets/decor/
