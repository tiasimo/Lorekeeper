name: lorekeeper
description: "Lorekeeper – il custode delle tue storie. Lettore di novel EPUB."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  archive: '>=3.6.0 <5.0.0'
  xml: ^6.5.0
  file_picker: ^10.0.0
  path_provider: ^2.1.4
  path: ^1.9.0
  shared_preferences: ^2.3.0
  flutter_secure_storage: ^9.2.2
  google_fonts: ^6.2.1
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/dividers/
