name: lorekeeper
description: "Lorekeeper – il custode delle tue storie. Lettore di novel EPUB."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  archive: '>=3.6.0 <5.0.0'
  xml: ^6.5.0
  file_picker: ^10.0.0
  path_provider: ^2.1.4
  path: ^1.9.0
  shared_preferences: ^2.3.0
  flutter_secure_storage: ^9.2.2
  google_fonts: ^6.2.1
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#1C1714"
  adaptive_icon_foreground: "assets/icon/foreground.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#1C1714"
  image: "assets/icon/splash.png"
  android_12:
    color: "#1C1714"
    image: "assets/icon/splash.png"
    icon_background_color: "#1C1714"

flutter:
  uses-material-design: true
  assets:
    - assets/dividers/
