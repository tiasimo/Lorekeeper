name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FLUTTER_VERSION: "3.41.6"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # La cartella android/ viene generata qui: nel repo c'è solo il codice Dart.
      - name: Genera il progetto Android
        run: |
          flutter create --platforms=android --org com.tiasimo --project-name lorekeeper .
          rm -rf test
          python3 ci/patch_android.py
          python3 ci/android_extras.py

      # Chiave di firma fissa: così ogni nuovo APK si installa sopra il precedente senza perdere i dati.
      - name: Chiave di firma
        run: |
          mkdir -p ~/.android
          cp android-signing/debug.keystore ~/.android/debug.keystore

      - name: Caratteri inclusi nell'app
        run: python3 ci/fetch_fonts.py

      - run: flutter pub get

      - name: Icona e avvio con la lanterna
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: Compila APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Controllo firma
        run: |
          BT=$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          $ANDROID_HOME/build-tools/$BT/apksigner verify --print-certs build/app/outputs/flutter-apk/app-release.apk | head -5

      - uses: actions/upload-artifact@v4
        with:
          name: Lorekeeper-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # Pubblica l'APK come release: l'app la trova da sola in "Cerca aggiornamenti".
      - name: Pubblica la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk Lorekeeper.apk
          MSG=$(git log -1 --pretty=%s)
          gh release create "build-${{ github.run_number }}" Lorekeeper.apk --title "Lorekeeper build ${{ github.run_number }}" --notes "$MSG" --latest
