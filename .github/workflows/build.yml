name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FLUTTER_VERSION: "3.41.6"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # La cartella android/ viene generata qui: nel repo c'è solo il codice Dart.
      - name: Genera il progetto Android
        run: |
          flutter create --platforms=android --org com.tiasimo --project-name lorekeeper .
          rm -rf test
          python3 ci/patch_android.py

      # Chiave di firma fissa: così ogni nuovo APK si installa sopra il precedente senza perdere i dati.
      - name: Chiave di firma
        run: |
          mkdir -p ~/.android
          cp android-signing/debug.keystore ~/.android/debug.keystore

      - run: flutter pub get

      - name: Icona e avvio con la lanterna
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: Compila APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: Lorekeeper-apk
          path: build/app/outputs/flutter-apk/app-release.apk
